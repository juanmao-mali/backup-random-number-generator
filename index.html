<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炫酷随机数生成器</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(45deg, #7f7fd5, #86a8e7, #91eae4);
            font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
            transition: background 1s ease;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            padding: 2.5rem;
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            backdrop-filter: blur(20px);
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .number-display {
            font-size: 6rem;
            color: #7f7fd5;
            margin: 1.5rem 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            position: relative;
            transition: all 0.3s ease;
        }

        .number-display::before {
            content: '🎲';
            position: absolute;
            font-size: 2rem;
            opacity: 0;
            transform: scale(0);
        }

        .number-display.animate::before {
            animation: diceRoll 1s infinite;
        }

        @keyframes diceRoll {
            0% {
                opacity: 0;
                transform: scale(0) rotate(0deg) translateY(0);
            }
            50% {
                opacity: 1;
                transform: scale(1) rotate(180deg) translateY(-50px);
            }
            100% {
                opacity: 0;
                transform: scale(0) rotate(360deg) translateY(-100px);
            }
        }

        .number-display.animate {
            animation: numberBounce 0.5s ease-in-out infinite alternate;
        }

        @keyframes numberBounce {
            0% { 
                transform: scale(1);
                text-shadow: 0 0 10px rgba(127, 127, 213, 0.5);
            }
            100% { 
                transform: scale(1.1);
                text-shadow: 0 0 20px rgba(127, 127, 213, 0.8);
            }
        }

        .button {
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }

        .button:hover::after {
            width: 200px;
            height: 200px;
        }

        .start {
            background: linear-gradient(45deg, #88d8b0, #86a8e7);
            color: white;
            box-shadow: 0 4px 15px rgba(134, 168, 231, 0.3);
        }

        .stop {
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.3);
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .button:active {
            transform: translateY(1px);
        }

        h1 {
            color: #4a4a8f;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            font-size: 2.5rem;
        }

        .used-numbers {
            margin-top: 2rem;
            font-size: 1rem;
            color: #7f7fd5;
            max-width: 80%;
            margin: 2rem auto;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* 添加彩色粒子效果 */
        .particle {
            position: absolute;
            pointer-events: none;
            animation: particleFade 1s ease-out forwards;
        }

        @keyframes particleFade {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 随机数生成器 🎲</h1>
        <div class="number-display" id="numberDisplay">?</div>
        <div>
            <button class="button start" id="startBtn">开始</button>
            <button class="button stop" id="stopBtn" disabled>停止</button>
        </div>
        <div class="used-numbers" id="usedNumbers">已使用的数字：</div>
    </div>

    <script>
        const numberDisplay = document.getElementById('numberDisplay');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const usedNumbersDisplay = document.getElementById('usedNumbers');
        
        let interval;
        let usedNumbers = new Set();
        let availableNumbers = Array.from({length: 100}, (_, i) => i + 1);

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function updateUsedNumbers() {
            const numbers = Array.from(usedNumbers).sort((a, b) => a - b);
            usedNumbersDisplay.textContent = `已使用的数字：${numbers.join(', ')}`;
        }

        // 添加粒子效果函数
        function createParticle(x, y) {
            const particle = document.createElement('span');
            particle.className = 'particle';
            particle.textContent = ['🎲', '✨', '🎯', '🎨'][Math.floor(Math.random() * 4)];
            
            const angle = Math.random() * Math.PI * 2;
            const distance = 100 + Math.random() * 100;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;
            
            particle.style.setProperty('--tx', `${tx}px`);
            particle.style.setProperty('--ty', `${ty}px`);
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;
            
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 1000);
        }

        function startGenerator() {
            if (availableNumbers.length === 0) {
                alert('所有数字都已经使用过了！');
                return;
            }

            startBtn.disabled = true;
            stopBtn.disabled = false;
            numberDisplay.classList.add('animate');

            // 添加粒子效果
            const rect = numberDisplay.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            interval = setInterval(() => {
                shuffleArray(availableNumbers);
                numberDisplay.textContent = availableNumbers[0];
                
                // 随机位置创建粒子
                createParticle(
                    centerX + (Math.random() - 0.5) * 100,
                    centerY + (Math.random() - 0.5) * 100
                );

                const hue = Math.random() * 60 + 180;
                document.body.style.background = `linear-gradient(${Math.random() * 360}deg, 
                    hsl(${hue}, 60%, 70%), 
                    hsl(${hue + 30}, 60%, 70%), 
                    hsl(${hue + 60}, 60%, 70%))`;
            }, 100);
        }

        function stopGenerator() {
            clearInterval(interval);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            numberDisplay.classList.remove('animate');

            const selectedNumber = parseInt(numberDisplay.textContent);
            usedNumbers.add(selectedNumber);
            availableNumbers = availableNumbers.filter(num => num !== selectedNumber);
            updateUsedNumbers();

            if (availableNumbers.length === 0) {
                startBtn.disabled = true;
                alert('所有数字都已经使用过了！');
            }
        }

        startBtn.addEventListener('click', startGenerator);
        stopBtn.addEventListener('click', stopGenerator);
    </script>
</body>
</html>
